<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TapSlip · Restaurant Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>

  <!-- ===== Owner login ===== -->
  <div class="login-wrap" id="loginView">
    <form class="login-card" id="loginForm">
      <div class="login-badge">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.5 10a4.5 4.5 0 0 0-3.2-7.65A4.5 4.5 0 0 0 12 1.5a4.5 4.5 0 0 0-2.3.85A4.5 4.5 0 0 0 6.5 10v.5h11V10z"/>
          <path d="M6.5 12.6v3.1c0 .5.4.9.9.9h9.2c.5 0 .9-.4.9-.9v-3.1h-11z"/>
          <path d="M8 17.7v2.1c0 .6.5 1.1 1.1 1.1h5.8c.6 0 1.1-.5 1.1-1.1v-2.1H8z" opacity=".8"/>
        </svg>
      </div>
      <h1>Owner Access</h1>
      <p>Sign in to manage your menu, orders, tables, staff and revenue.</p>
      <div class="pin-field" id="pinField">
        <span>🔒</span>
        <input
          id="pinInput"
          type="password"
          inputmode="numeric"
          maxlength="4"
          placeholder="••••"
          autocomplete="current-password"
        />
      </div>
      <div class="login-error" id="loginError"></div>
      <button class="btn btn-primary btn-block mt-16" type="submit">Unlock Dashboard</button>
      <div class="login-hint">Demo owner PIN: <strong>1234</strong></div>
    </form>
  </div>

  <!-- ===== Admin app ===== -->
  <div class="app" id="appView">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17.5 10a4.5 4.5 0 0 0-3.2-7.65A4.5 4.5 0 0 0 12 1.5a4.5 4.5 0 0 0-2.3.85A4.5 4.5 0 0 0 6.5 10v.5h11V10z"/>
            <path d="M6.5 12.6v3.1c0 .5.4.9.9.9h9.2c.5 0 .9-.4.9-.9v-3.1h-11z"/>
            <path d="M8 17.7v2.1c0 .6.5 1.1 1.1 1.1h5.8c.6 0 1.1-.5 1.1-1.1v-2.1H8z" opacity=".8"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Tapsli<span class="accent">p</span></div>
          <div class="brand-sub">Scan · Order · Enjoy</div>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-page="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
          Dashboard
        </button>
        <button class="nav-item" data-page="orders">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-2.5-1.7L14 21l-2-1.5L10 21l-2.5-1.7L5 21V3z"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg>
          Orders
        </button>
        <button class="nav-item" data-page="menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v7a3 3 0 0 0 3 3h1a3 3 0 0 0 3-3V2"/><path d="M7.5 2v20"/><path d="M20 15V2a4 4 0 0 0-4 4v6a3 3 0 0 0 3 3h1zm0 0v7"/></svg>
          Menu Management
        </button>
        <button class="nav-item" data-page="tables">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="4" rx="1.5"/><path d="M5.5 9v10M18.5 9v10M12 9v4"/></svg>
          Tables
        </button>
        <button class="nav-item" data-page="customers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Customers
        </button>


        <button class="nav-item" data-page="inventory">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg>
          Inventory
        </button>
        <button class="nav-item" data-page="finance">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          GST &amp; Finance
        </button>
        <button class="nav-item" data-page="reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
          Reports
        </button>
        <button class="nav-item" data-page="employees">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Staff
        </button>
        <button class="nav-item" data-page="socials">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          Social Media
        </button>
        <button class="nav-item" data-page="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </button>
      </nav>

      <div class="promo">
        <div class="promo-inner">
          <div class="promo-qr" id="promoQR"></div>
          <div class="promo-body">
            <div class="promo-title">Scan QR<br />Order at Table</div>
            <button class="promo-btn" data-goto="tables">View Demo</button>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="pageTitle">Welcome Back!</h1>
          <div class="topbar-sub" id="pageSub">TapSlip Restaurant</div>
        </div>
        <div class="topbar-right">
          <div class="topbar-actions" id="topbarActions"></div>

          <button class="open-pill" id="openToggleBtn" title="Open / close the restaurant">
            <span class="open-dot"></span><span id="openLabel">Open</span>
          </button>

          <button class="date-pill" id="datePill" title="Today">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <span id="dateLabel">—</span>
          </button>

          <button class="bell" id="bellBtn" title="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="bell-dot"></span>
          </button>

          <div class="profile" id="profilePill" title="Signed in account">
            <div class="avatar">RO</div>
            <div class="profile-text">Restaurant Owner</div>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </div>

          <button class="logout-btn" id="logoutBtn" title="Log out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/><path d="M12 2v10"/></svg>
          </button>
        </div>
      </header>

      <div id="pageBody"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Firebase platform (public web SDK) — loaded before app.js. -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@latest/dist/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
